[pytest]
# `python -m pytest` puts the working directory on sys.path; the `pytest` console
# script does not. Without this, `cd backend && pytest tests/` fails to import `app`
# while `python -m pytest tests/` succeeds -- so the suite passed locally and failed
# in CI for a reason that had nothing to do with the code.
#
# Declaring the path here makes the suite runnable the same way by anyone, which is
# the point of a reproducible test command.
pythonpath = .
testpaths = tests
