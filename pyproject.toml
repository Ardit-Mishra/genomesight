[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.85",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "spyprot>=0.9.6",
    "streamlit>=1.49.1",
]

# Build-time only (not runtime) deps for the optional native k-mer
# accelerator -- see build_kmer_ext.py and README.md's "Native k-mer
# accelerator" section. Never required to run the app.
[project.optional-dependencies]
native = [
    "cython>=3.0",
    "setuptools>=68",
]
