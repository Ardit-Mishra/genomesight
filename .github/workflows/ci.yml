name: CI

# Runs the test suites and builds the frontend on every push and pull request.
#
# This exists because the repository previously had exactly one workflow -- a
# keep-alive ping -- which meant nothing verified the code automatically. A green
# repository with no test workflow is a worse signal than no workflow at all,
# because it implies verification that is not happening.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build the native k-mer accelerator
        # Optional by design: the pure-Python path is always available. Building it
        # here means CI exercises the native path, which is what production runs --
        # a test suite that only ever sees the fallback cannot catch a divergence
        # between the two implementations.
        run: |
          pip install cython setuptools
          python build_kmer_ext.py build_ext --inplace \
            && echo "native accelerator: BUILT" \
            || echo "native accelerator: NOT BUILT — suite will use the Python path"

      - name: Report which k-mer engine the suite will exercise
        run: python -c "from app.core.kmer_native import backend_status; print(backend_status())"

      - name: Run tests
        run: pytest tests/ -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
